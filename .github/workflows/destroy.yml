# Desprovisiona um ambiente inteiro. Existe porque produção subiu por acidente:
# um merge em `main` disparava o Deploy, e o Deploy resolvia `main` como produção.
# O gatilho foi removido, mas o cluster que já tinha sido criado precisava de uma
# forma segura e auditável de sair — não de um `terraform destroy` na máquina de
# alguém, sem registro.
#
# Só roda quando disparado à mão, e só depois que o nome do ambiente for digitado
# por extenso no campo de confirmação.
name: Destroy

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente a destruir"
        required: true
        type: choice
        options: [prod, hml]
      confirmacao:
        description: "Digite o nome do ambiente para confirmar (prod ou hml)"
        required: true
        type: string

concurrency:
  group: destroy-${{ inputs.ambiente }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.8

jobs:
  destroy:
    name: "terraform destroy: ${{ inputs.ambiente }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente == 'prod' && 'producao' || 'homologacao' }}
    steps:
      # Digitar o nome do ambiente é o que separa "cliquei sem querer" de
      # "eu quis". O `environment` acima dá a segunda trava, se houver reviewer.
      - name: Conferir a confirmação
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmacao }}" != "${{ inputs.ambiente }}" ]; then
            echo "::error::A confirmação não bate com o ambiente escolhido. Nada foi feito."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina/oficina-infra-k8s/${{ inputs.ambiente }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=oficina-tflock" \
            -backend-config="encrypt=true"

      # O ECR guarda as imagens da aplicação, não o cluster. Destruir o ambiente
      # não deve apagar o registro: se ele estiver neste state, sai do state e
      # continua existindo na conta. Hoje `prod` nunca chegou a registrá-lo — o
      # apply falhava justamente ali — mas isso não é garantia para amanhã.
      - name: Preservar o ECR
        run: |
          set -euo pipefail
          for recurso in aws_ecr_lifecycle_policy.api aws_ecr_repository.api; do
            if terraform state list | grep -qx "$recurso"; then
              echo "removendo $recurso do state (o recurso continua na conta)"
              terraform state rm "$recurso"
            else
              echo "$recurso não está neste state"
            fi
          done

      - name: O que será destruído
        run: |
          set -euo pipefail
          terraform plan -destroy -input=false -no-color \
            -var-file=envs/${{ inputs.ambiente }}.tfvars \
            -var="newrelic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            | tail -n 120

      - name: terraform destroy
        run: |
          set -euo pipefail
          terraform destroy -input=false -auto-approve \
            -var-file=envs/${{ inputs.ambiente }}.tfvars \
            -var="newrelic_license_key=${{ secrets.NEW_RELIC_LICENSE_KEY }}"

      # Um destroy que deixa recursos para trás é pior que um que falha alto:
      # o custo continua e ninguém fica sabendo.
      - name: Conferir que o state ficou vazio
        run: |
          set -euo pipefail
          restante=$(terraform state list | wc -l)
          echo "recursos restantes no state: $restante"
          terraform state list || true
          test "$restante" -eq 0
